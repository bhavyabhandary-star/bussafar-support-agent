# Render Blueprint for BusSafar (Sahil): one service, the customer website with the Sahil chat built in.
# Render > New > Blueprint > pick this repo. You will be asked for the two secrets.
# (The Streamlit staff app still runs locally with: streamlit run app.py)
services:
  - type: web
    name: bussafar-support
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt chromadb uvicorn
    startCommand: uvicorn web.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: GOOGLE_API_KEY
        sync: false   # secret: entered in the Render dashboard, never committed
      - key: APP_PASSCODE
        sync: false   # secret: entered in the Render dashboard, never committed
      - key: GEMINI_CHAT_MODEL
        value: gemini-3.5-flash-lite
